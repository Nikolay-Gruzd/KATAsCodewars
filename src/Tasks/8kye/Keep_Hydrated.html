<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--
Nathan loves cycling.

Because Nathan knows it is important to stay hydrated, he drinks 0.5 litres of water per hour of cycling.

You get given the time in hours and you need to return the number of litres Nathan will drink, rounded down.

For example:

time = 3 ==> litres = 1

time = 6.7 ==> litres = 3

time = 11.8 ==> litres = 5

Натан обожает ездить на велосипеде.

Поскольку Натан знает, как важно поддерживать водный баланс, он выпивает 0,5 литра воды за каждый час езды.

Вам дано время в часах, и вы должны вернуть количество литров, которое выпьет Натан, округленное в меньшую сторону.
-->
<script>

    const time1 = 3
    const time2 = 6.7
    const time3 = 11.8

    function litres(time) {
        return Math.floor(time * 0.5);
    }

    console.log("Ответ:  " + litres(time1)) // = 1
    console.log("Ответ:  " + litres(time2)) // = 3
    console.log("Ответ:  " + litres(time3)) // = 5
</script>
</body>
</html>
