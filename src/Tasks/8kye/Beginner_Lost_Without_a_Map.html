<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--
Given an array of integers, return a new array with each value doubled.

For example:

[1, 2, 3] ==> [2, 4, 6]

---------------------

Дана последовательность целых чисел. Верните массив, в котором каждое значение удвоено.

Например:

[1, 2, 3] ==> [2, 4, 6]
-->
<script>

    function maps(x){
        return x.map(m => m * 2)
    }

    console.log("Ответ:  " + maps([1,2,3]))
</script>
</body>
</html>
