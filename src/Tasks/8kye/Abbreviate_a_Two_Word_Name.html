<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--
Write a function to convert a name into initials. This kata strictly takes two words with one space in between them.

The output should be two capital letters with a dot separating them.

It should look like this:

Sam Harris => S.H

patrick feeney => P.F

Напишите функцию для преобразования имени в инициалы. Эта задача строго принимает два слова, разделённых одним пробелом.

В результате должны получиться две заглавные буквы, разделённые точкой.
-->
<script>

    const name1 = 'Sam Harris'
    const name2 = 'patrick feeney'

    function abbrevName(name) {
        // const  [firstName, lastName] = name.split(' ')
        // return `${firstName[0]}.${lastName[0]}`.toUpperCase()
        return name.split(' ').map(word => word[0]).join('.').toUpperCase()
    }

    console.log("Ответ:  " + abbrevName(name1)) // = S.H
    console.log("Ответ:  " + abbrevName(name2)) // = P.F
</script>
</body>
</html>
