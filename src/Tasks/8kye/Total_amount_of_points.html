<body>
<!--
Our football team has finished the championship.

Our team's match results are recorded in a collection of strings. Each match is represented by a string in the
format "x:y", where x is our team's score and y is our opponents score.

For example: ["3:1", "2:2", "0:1", ...]

Points are awarded for each match as follows:

if x > y: 3 points (win)
if x < y: 0 points (loss)
if x = y: 1 point (tie)
We need to write a function that takes this collection and returns the number of points our team (x) got in the
championship by the rules given above.

Notes:

our team always plays 10 matches in the championship
0 <= x <= 4
0 <= y <= 4

---------------------

Наша футбольная команда завершила участие в чемпионате.

Результаты матчей нашей команды представлены в виде списка строк. Каждый матч записан как строка формата «x:y»,
где x — количество голов, забитых нашей командой, а y — количество голов, забитых соперником.

Например: ["3:1", "2:2", "0:1", ...]

За каждый матч начисляются очки:

если x > y: 3 очка (победа)
если x < y: 0 очков (поражение)
если x = y: 1 очко (ничья)
Необходимо написать функцию, которая принимает этот список и возвращает общее количество очков,
набранных нашей командой (x) в чемпионате согласно указанным правилам.

Примечания:

в рамках чемпионата наша команда всегда проводит 10 матчей
0 <= x <= 4
0 <= y <= 4
-->
<script>

    const g = ["1:0","2:0","3:0","4:0","2:1","3:1","4:1","3:2","4:2","4:3"]

    function points(games) {
        // let res = 0
        // games.forEach( el => {
        //     const elArr = el.split('')
        //     if (Number(elArr[0]) > Number(elArr[2])) {
        //         res += 3
        //     } else if (Number(elArr[0]) === Number(elArr[2])) {
        //         res += 1
        //     }
        // })
        // return res

        return games.reduce((acc, cur) => {
            return acc += cur[0] > cur[2] ? 3 : cur[0] === cur[2] ? 1 : 0
        }, 0)
    }

    console.log("Ответ:  " + points(g))
</script>
