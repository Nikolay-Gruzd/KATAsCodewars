<!--
Create a function that accepts a parameter representing a name and returns the message:

Создайте функцию, которая принимает в качестве параметра имя и возвращает сообщение:
"Привет, <имя>, как дела сегодня?".
[Убедитесь, что вы ввели именно то, что я написал, иначе программа может выполниться некорректно].
-->
<script>

    const name = "Piter"

    function greet(name){
        return `Hello, ${name} how are you doing today?`
    }

    console.log("Ответ:  " + greet(name)) // = Piter
</script>
