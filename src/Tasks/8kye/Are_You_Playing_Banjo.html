<body>
<!--
Create a function which answers the question "Are you playing banjo?".
If your name starts with the letter "R" or lower case "r", you are playing banjo!

The function takes a name as its only argument, and returns one of the following strings:

name + " plays banjo"
name + " does not play banjo"
Names given are always valid strings.

----------------------

Создайте функцию, которая отвечает на вопрос «Вы играете на банджо?».

Если ваше имя начинается с буквы «R» или строчной «r», значит, вы играете на банджо!

Функция принимает имя в качестве единственного аргумента и возвращает одну из следующих строк:

имя + "играет на банджо"
имя + "не играет на банджо"
Указанные имена всегда являются допустимыми строками.
-->
<script>

    const name1 = 'dingo'
    const name2 = 'roman'
    const name3 = 'Rito'

    function areYouPlayingBanjo(name) {
        return name + (name[0].toLowerCase() === 'r' ? ' plays' : ' does not play') + ' banjo'
    }

    console.log("Ответ:  " + areYouPlayingBanjo(name1)) // = 0
    console.log("Ответ:  " + areYouPlayingBanjo(name2)) // = 0
    console.log("Ответ:  " + areYouPlayingBanjo(name3)) // = 0
</script>
</body>
</html>
