    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--
ask
Sum all the numbers of a given array ( cq. list ), except the highest and the lowest element (by value, not by index!).

The highest or lowest element respectively is a single element at each edge, even if there are more than one with the
same value.

Mind the input validation.

Example
{ 6, 2, 1, 8, 10 } => 16
{ 1, 1, 11, 2, 3 } => 6
Input validation
If an empty value ( null, None, Nothing, nil etc. ) is given instead of an array, or the given array is an empty list
or a list with only 1 element, return 0.

---------------------

Найдите сумму всех чисел в заданном массиве (или списке), исключив из неё наибольший и наименьший элементы
(по значению, а не по индексу!).

Наибольшим или наименьшим элементом считается один конкретный элемент на каждом из «краев»
(максимального и минимального значений), даже если в массиве есть несколько одинаковых элементов с такими значениями.

Не забудьте предусмотреть проверку входных данных.

Пример
{ 6, 2, 1, 8, 10 } => 16
{ 1, 1, 11, 2, 3 } => 6
Проверка входных данных
Если вместо массива передано пустое значение (null, None, Nothing, nil и т. д.), либо если массив пуст или содержит
только один элемент, верните 0.
-->
<script>

    function sumArray(array) {
        if (array && array.length > 2) {
            let minId = 0
            let maxId = -1
            for (let i = 0; i < array.length; i++) {
                if (array[i] < array[minId]) {
                    minId = i
                }
            }
            for (let i = 0; i < array.length; i++) {
                if (i === minId) continue;
                if (maxId === -1 || array[i] > array[maxId]) {
                    maxId = i
                }
            }
            return array.filter((_, i) => i !== minId && i !== maxId).reduce((a, b) => a + b);
        }
        return 0

        // return arr => arr ? arr.sort((x, y) => x - y).slice(1, -1).reduce((s, e) => s + e, 0) : 0

        // return Array.isArray(array) && array.length > 2
        //     ? array.reduce((s, n) => s + n, 0) - Math.min(...array) - Math.max(...array)
        //     : 0
    }

    console.log("Ответ:  " + sumArray([]))
    console.log("Ответ:  " + sumArray([3]))
    console.log("Ответ:  " + sumArray([3, 5]))
    console.log("Ответ:  " + sumArray([6, 2, 1, 8, 10]))
    console.log("Ответ:  " + sumArray([-6, 20, -1, 10, -12]))
    console.log("Ответ:  " + sumArray([0, 1, 6, 10, 10]))

    console.log("Ответ:  " + sumArray([5, 5, 5]))

    console.log("Ответ:  " + sumArray([NaN]))
    console.log("Ответ:  " + sumArray(null))
    console.log("Ответ:  " + sumArray('s'))
    console.log("Ответ:  " + sumArray([undefined]))
    console.log("Ответ:  " + sumArray(0))
    console.log("Ответ:  " + sumArray(false))

</script>
</body>
</html>
