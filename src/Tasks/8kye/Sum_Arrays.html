<!--
Write a function that takes an array of numbers and returns the sum of the numbers. The numbers can be negative.
If the array is empty, return 0.

Examples
Input: [1, 5.2, 4, 0, -1]
Output: 9.2

Input: [-2.398]
Output: -2.398

Input: []
Output: 0

Assumptions
You can assume that you are given a (possibly empty) valid array containing only numbers.
What We're Testing
We're testing basic loops and math operations. This is for beginners who are just learning loops and math operations.
Advanced users may find this extremely easy and can easily write this in one line.

---------------------------

Напишите функцию, которая принимает массив чисел и возвращает сумму этих чисел. Числа могут быть отрицательными.
Если массив пуст, верните 0.

Примеры
Вход: [1, 5.2, 4, 0, -1]
Выход: 9.2

Вход: [-2.398]
Выход: -2.398

Вход: []
Выход: 0

Предположения
Можно предположить, что вам дан (возможно, пустой) допустимый массив, содержащий только числа.
Что мы тестируем
Мы тестируем базовые циклы и математические операции. Это для начинающих, которые только изучают циклы и
математические операции.
Продвинутые пользователи могут найти это очень простым и легко написать это в одну строку.
-->
<script>

    const nums1 = [1, 5.2, 4, 0, -1]
    const nums2 = [-2.398]
    const nums3 = []

    function sum (numbers) {
        // let sum = 0
        // numbers.length && numbers.map(n => sum += n)
        // return sum
        return numbers.reduce((a, b) => a + b, 0);
    }

    console.log("Ответ:  " + sum(nums1)) // = 9.2
    console.log("Ответ:  " + sum(nums2)) // = -2.398
    console.log("Ответ:  " + sum(nums3)) // = 0
</script>
</body>
