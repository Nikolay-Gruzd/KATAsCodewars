<body>
<!--
All of the animals are having a feast! Each animal is bringing one dish. There is just one rule: the dish must start
and end with the same letters as the animal's name. For example, the great blue heron is bringing garlic naan
and the chickadee is bringing chocolate cake.

Write a function feast that takes the animal's name and dish as arguments and returns true or false to indicate
whether the beast is allowed to bring the dish to the feast.

Assume that beast and dish are always lowercase strings, and that each has at least two letters.
beast and dish may contain hyphens and spaces, but these will not appear at the beginning or end of the string.
They will not contain numerals.

---------------------

Все животные устраивают пир! Каждое животное приносит одно блюдо. Есть только одно правило:
название блюда должно начинаться и заканчиваться теми же буквами, что и название животного.
Например, большая голубая цапля (great blue heron) приносит чесночную лепешку (garlic naan),
а гаичка (chickadee) — шоколадный торт (chocolate cake).

Напишите функцию `feast`, которая принимает в качестве аргументов название животного и название блюда,
а затем возвращает `true` или `false` — в зависимости от того, разрешено ли животному принести это блюдо на пир.

Предполагается, что названия животного и блюда всегда представлены строчными буквами и состоят
как минимум из двух символов. В них могут встречаться дефисы и пробелы, но они не будут находиться в начале
или конце строки. Цифры в названиях отсутствуют.
-->
<script>

    function feast(beast, dish) {
        return beast[0] === dish[0] && beast[beast.length - 1] === dish[dish.length - 1];
    }

    console.log("Ответ:  " + feast("great blue heron", "garlic naan"))
    console.log("Ответ:  " + feast("chickadee", "chocolate cake"))
    console.log("Ответ:  " + feast("brown bear", "bear claw"))
</script>
</body>
</html>
