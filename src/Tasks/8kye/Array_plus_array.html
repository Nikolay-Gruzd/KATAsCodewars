<!--
I'm new to coding and now I want to get the sum of two arrays... Actually the sum of all their elements.
I'll appreciate for your help.

P.S. Each array includes only integer numbers. Output is a number too.

---------------------

Я новичок в программировании и хочу найти сумму двух массивов... точнее, сумму всех их элементов.
Буду признателен за помощь.

P.S. Каждый массив содержит только целые числа. Результат тоже должен быть числом.
-->
<script>

    const arr1 = [1, 2, 3]
    const arr2 = [4, 5, 6]

    function arrayPlusArray(arr1, arr2) {
        return arr1.concat(arr2).reduce((a, b) => a + b);
    }

    console.log("Ответ:  " + arrayPlusArray(arr1, arr2))
</script>
