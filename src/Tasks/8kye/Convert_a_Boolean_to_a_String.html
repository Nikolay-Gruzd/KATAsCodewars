<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--
Implement a function which convert the given boolean value into its string representation.

Note: Only valid inputs will be given.

---------------------

Реализуйте функцию, которая преобразует заданное логическое значение в его строковое представление.

Примечание: будут приниматься только допустимые входные данные.
-->
<script>

    function booleanToString(b){
        return b.toString()
    }

    console.log("Ответ:  " + booleanToString(true))
    console.log("Ответ:  " + booleanToString(false))
</script>
</body>
</html>
