<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--
Convert number to reversed array of digits

35231 => [1,3,2,5,3]
0     => [0]

Преобразовать число в обратный массив цифр.
-->
<script>

    const num1 = 35231
    const num2 = 0

    function digitize(n) {
        // return Array.from(String(n), Number).reverse();
        // return String(n).split('').reverse().map(m => Number(m))
        return String(n).split('').reverse().map(Number)
    }

    console.log("Ответ:  " + digitize(num1)) // = [1,3,2,5,3]
    console.log("Ответ:  " + digitize(num2)) // = [0]
</script>
</body>
</html>
