<body>
<!--
Given an array of integers as strings and numbers, return the sum of the array values as if all were numbers.

Return your answer as a number.

---------------------

Дан массив целых чисел, представленных в виде строк и чисел; верните сумму значений этого массива,
как если бы все они были числами.

Результат должен быть представлен в виде числа.
-->
<script>

    function sumMix(x){
        return x.reduce((a, b) => a + Number(b), 0);
    }

    console.log("Ответ:  " + sumMix([9, 3, '7', '3']))
    console.log("Ответ:  " + sumMix(['5', '0', 9, 3, 2, 1, '9', 6, 7]))
    console.log("Ответ:  " + sumMix(['3', 6, 6, 0, '5', 8, 5, '6', 2,'0']))
</script>
</body>
</html>
