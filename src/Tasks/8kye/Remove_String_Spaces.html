<!--
Write a function that removes the spaces from the string, then return the resultant string.

Examples (Input -> Output):

"8 j 8   mBliB8g  imjB8B8  jl  B" -> "8j8mBliB8gimjB8B8jlB"
"8 8 Bi fk8h B 8 BB8B B B  B888 c hl8 BhB fd" -> "88Bifk8hB8BB8BBBB888chl8BhBfd"
"8aaaaa dddd r     " -> "8aaaaaddddr"

Напишите функцию, которая удаляет пробелы из строки, а затем возвращает результирующую строку.

Примеры (Ввод -> Вывод):
-->
<script>

    const str1 = '8 j 8   mBliB8g  imjB8B8  jl  B'
    const str2 = '8 8 Bi fk8h B 8 BB8B B B  B888 c hl8 BhB fd'
    const str3 = ' 8aaaaa dddd r     '

    function noSpace(str) {
        return str.replaceAll(' ', '')
    }

    console.log("Ответ:  " + noSpace(str1)) // =
    console.log("Ответ:  " + noSpace(str2)) // =
    console.log("Ответ:  " + noSpace(str3)) // =
</script>
</body>
</html>
