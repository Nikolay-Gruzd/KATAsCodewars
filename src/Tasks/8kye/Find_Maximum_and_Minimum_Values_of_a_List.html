<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--
Your task is to make two functions ( max and min, or maximum and minimum, etc., depending on the language )
that receive a list of integers as input, and return the largest and lowest number in that list, respectively.
Each function returns one number.

Examples (Input -> Output)
* [4,6,2,1,9,63,-134,566]         -> max = 566, min = -134
* [-52, 56, 30, 29, -54, 0, -110] -> min = -110, max = 56
* [42, 54, 65, 87, 0]             -> min = 0, max = 87
* [5]                             -> min = 5, max = 5

---------------------

Ваша задача — создать две функции (например, `max` и `min`), которые принимают на вход список целых чисел и возвращают
соответственно наибольшее и наименьшее из них. Каждая функция должна возвращать одно число.

Примеры (Входные данные -> Результат)
* [4, 6, 2, 1, 9, 63, -134, 566]         -> max = 566, min = -134
* [-52, 56, 30, 29, -54, 0, -110] -> min = -110, max = 56
* [42, 54, 65, 87, 0]             -> min = 0, max = 87
* [5]                             -> min = 5, max = 5
-->
<script>

    const arr1 = [4, 6, 2, 1, 9, 63, -134, 566]
    const arr2 = [-52, 56, 30, 29, -54, 0, -110]
    const arr3 = [42, 54, 65, 87, 0]
    const arr4 = [5]

    const min = function(list){
        return list.reduce((acc, item) => (acc > item) ? item : acc)
    }

    const max = function(list){
        return list.reduce((acc, item) => (acc < item) ? item : acc)
    }

    console.log("Ответ:  " + max(arr1) + " - " + min(arr1))
    console.log("Ответ:  " + max(arr2) + " - " + min(arr2))
    console.log("Ответ:  " + max(arr3) + " - " + min(arr3))
    console.log("Ответ:  " + max(arr4) + " - " + min(arr4))
</script>
</body>
</html>
