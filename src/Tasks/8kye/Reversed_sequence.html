<body>
<!--
Build a function that returns an array of integers from n to 1 where n>0.

Example : n=5 ==> [5,4,3,2,1]

---------------------

Напишите функцию, которая возвращает массив целых чисел от n до 1, где n > 0.

Пример: n=5 ==> [5, 4, 3, 2, 1]
-->
<script>

    const reverseSeq = n => {
        const arr = []
        for (let i = n; i > 0; i--) {
            arr.push(i)
        }
        return arr
    };

    console.log("Ответ:  " + reverseSeq(5))
    console.log("Ответ:  " + reverseSeq(6))
    console.log("Ответ:  " + reverseSeq(3))
    console.log("Ответ:  " + reverseSeq(1))
</script>
</body>
</html>
