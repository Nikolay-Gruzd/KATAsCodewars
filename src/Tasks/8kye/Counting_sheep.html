<!--
Consider an array/list of sheep where some sheep may be missing from their place.
We need a function that counts the number of sheep present in the array (true means present).

For example,

[true,  true,  true,  false,
  true,  true,  true,  true ,
  true,  false, true,  false,
  true,  false, false, true ,
  true,  true,  true,  true ,
  false, false, true,  true]

The correct answer would be 17.

Hint: Don't forget to check for bad values like null/undefined

Рассмотрим массив/список овец, в котором некоторые овцы могут отсутствовать на своих местах.
Нам нужна функция, которая подсчитывает количество овец, присутствующих в массиве (true означает присутствие).

Подсказка: Не забудьте проверить наличие некорректных значений, таких как null/undefined.
-->
<script>

    const sheeps = [
        true,  undefined,  null,  false,
        true,  true,  true,  true ,
        true,  false, true,  false,
        true,  false, false, true ,
        true,  true,  true,  true ,
        false, false, true,  true
    ]

    function countSheeps(sheeps) {
        let count = 0
        sheeps.map(s => s === true ? count+=1 : s)
        return count
        // return sheeps.filter(Boolean).length;
    }

    console.log("Ответ:  " + countSheeps(sheeps)) // = 15
</script>
</body>
