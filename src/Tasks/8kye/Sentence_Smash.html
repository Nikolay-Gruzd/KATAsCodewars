<body>
<!--
Sentence Smash
Write a function that takes an array of words and smashes them together into a sentence and returns the sentence.
You can ignore any need to sanitize words or add punctuation, but you should add spaces between each word. Be careful,
there shouldn't be a space at the beginning or the end of the sentence!

Example
['hello', 'world', 'this', 'is', 'great']  =>  'hello world this is great'
Assumptions
You can assume that you are only given words.
You cannot assume the size of the array.
You can assume that you do get an array.
What We're Testing
We're testing basic loops and string manipulation. This is for beginners who are just learning loops and string
manipulation.

Disclaimer
This is for beginners so we want to test basic loops and string manipulation.

---------------------

Sentence Smash (Сборка предложения)
Напишите функцию, которая принимает массив слов, объединяет их в одно предложение и возвращает его.
Вам не нужно беспокоиться об очистке слов или расстановке знаков препинания, но необходимо добавить пробелы
между словами. Будьте внимательны: в начале и в конце предложения пробелов быть не должно!

Пример
['hello', 'world', 'this', 'is', 'great']  =>  'hello world this is great'
Условия
Можно исходить из того, что на вход поступают только слова.
Размер массива заранее не известен.
Гарантируется, что на вход будет передан именно массив.
Что проверяется
Проверяются навыки использования базовых циклов и работы со строками. Задание предназначено для начинающих,
которые только осваивают эти темы.

Примечание
Поскольку задание рассчитано на новичков, мы проверяем базовые навыки работы с циклами и строками.
-->
<script>

    const arr = ['hello', 'world', 'this', 'is', 'great']

    function smash (words) {
        let result = ''
        words.forEach(word => { result = result + ' ' + word })
        return result.trim()

        // return words.join(' ');
    }

    console.log('Ответ:  ' + smash(arr))
</script>
</body>
