<body>
<!--
Jenny has written a function that returns a greeting for a user. However, she's in love with Johnny, and would like to
greet him slightly different. She added a special case to her function, but she made a mistake.

Can you help her?

---------------------

Дженни написала функцию, которая возвращает приветствие для пользователя.
Однако она влюблена в Джонни и хотела бы приветствовать его немного иначе. Она добавила в свою функцию особый случай,
но допустила ошибку.

Можете ей помочь?
-->
<script>

    function greet(name) {
        // if (name === "Johnny") {
        //     return "Hello, my love!";
        // }
        // return "Hello, " + name + "!";
        // return name === "Johnny" ? "Hello, my love!" : "Hello, " + name + "!"
        return `Hello, ${(name === "Johnny" ? "my love" : name)}!`
    }

    console.log("Ответ:  " + greet("Johnny"))
    console.log("Ответ:  " + greet("Jim"))
    console.log("Ответ:  " + greet("Simon"))
</script>
