<body>
<!--
Given a month as an integer from 1 to 12, return to which quarter of the year it belongs as an integer number.

For example: month 2 (February), is part of the first quarter; month 6 (June), is part of the second quarter;
and month 11 (November), is part of the fourth quarter.

Constraint:

1 <= month <= 12

---------------------

На вход подается номер месяца (целое число от 1 до 12). Необходимо вернуть номер квартала,
к которому относится этот месяц (также в виде целого числа).

Например: месяц 2 (февраль) относится к первому кварталу; месяц 6 (июнь) — ко второму кварталу;
а месяц 11 (ноябрь) — к четвертому кварталу.

Ограничение:

1 <= month <= 12
-->
<script>

    const quarterOf = (month) => {
        // return month <= 3 ? 1 : month <= 6 ? 2 : month <= 9 ? 3 : 4
        return Math.ceil(month / 3)
    }

    console.log("Ответ:  " + quarterOf(3))
    console.log("Ответ:  " + quarterOf(8))
    console.log("Ответ:  " + quarterOf(11))
</script>
</body>
