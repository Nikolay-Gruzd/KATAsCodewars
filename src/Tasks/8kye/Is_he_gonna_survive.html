<body>
<!--
A hero is on his way to the castle to complete his mission. However, he's been told that the castle is surrounded with
a couple of powerful dragons! each dragon takes 2 bullets to be defeated, our hero has no idea how many bullets he
should carry... Assuming he's gonna grab a specific given number of bullets and move forward to fight another specific
given number of dragons, will he survive?

Return true if yes, false otherwise :)

---------------------

Герой направляется к замку, чтобы выполнить свою миссию. Однако ему сообщили, что замок охраняют могучие драконы!
Чтобы победить одного дракона, нужно 2 пули, но герой не знает, сколько именно патронов ему взять с собой.
Если он возьмет определенное количество пуль и отправится сражаться с определенным количеством драконов,
удастся ли ему выжить?

Верните `true`, если да, и `false` в противном случае :)
-->
<script>

    const bullets = 6
    const dragons = 3

    function hero(bullets, dragons) {
        return dragons * 2 <= bullets
    }

    console.log("Ответ:  " + hero(bullets, dragons))
</script>
</body>
</html>
