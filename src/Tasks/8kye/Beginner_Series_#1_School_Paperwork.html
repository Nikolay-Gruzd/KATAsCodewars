<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--
Your classmates asked you to copy some paperwork for them. You know that there are 'n' classmates and the paperwork
has 'm' pages.

Your task is to calculate how many blank pages do you need. If n < 0 or m < 0 return 0.

Example:
n= 5, m=5: 25
n=-5, m=5:  0
Waiting for translations and Feedback! Thanks!

----------------------

Ваши одноклассники попросили вас переписать для них некоторые документы. Вы знаете, что есть «n» одноклассников,
и документы содержат «m» страниц.

Ваша задача — вычислить, сколько пустых страниц вам нужно. Если n < 0 или m < 0, верните 0.

Пример:
n=5, m=5: 25
n=-5, m=5: 0
Жду перевода и отзывов! Спасибо!
-->
<script>

    function paperwork(n, m) {
        return n < 0 || m < 0 ? 0 : n * m
    }


    console.log("Ответ:  " + paperwork(5, 5)) // = 25
    console.log("Ответ:  " + paperwork(5, -5)) // = 0
    console.log("Ответ:  " + paperwork(-5, 5)) // = 0
    console.log("Ответ:  " + paperwork(-5, -5)) // = 0
</script>
</body>
</html>
